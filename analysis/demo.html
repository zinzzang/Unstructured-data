<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사업보고서 변화 분석 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--border:#e4e3dc;--ink:#0d0d0c;--ink-2:#56544f;--muted:#9b9890;--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--yellow:#d49500;--gray:#9b9890;--red:#e34948;--accent:#1a5bbf;color-scheme:light;}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111110;--surface:#1c1c1b;--border:#2e2e2b;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--blue:#3987e5;--orange:#d95926;--aqua:#199e70;--yellow:#c98500;--gray:#898781;--red:#e66767;--accent:#5ba3f5;color-scheme:dark;}}
:root[data-theme=dark]{--bg:#111110;--surface:#1c1c1b;--border:#2e2e2b;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#898781;--blue:#3987e5;--orange:#d95926;--aqua:#199e70;--yellow:#c98500;--gray:#898781;--red:#e66767;--accent:#5ba3f5;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:28px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;}
.page{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.sel-bar{background:var(--accent);border-radius:10px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.sel-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.sel-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px;align-self:center;}
.sel-company{background:rgba(255,255,255,.18);border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:600;padding:7px 11px;cursor:pointer;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;}
.sel-company option{background:#1a5bbf;color:#fff;}
.period-pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{padding:5px 13px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,.18);color:#fff;font-family:inherit;transition:background .15s;}
.pill.active,.pill:hover{background:rgba(255,255,255,.38);}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.kpi-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.kpi-value{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:11px;margin-top:4px;color:var(--ink-2);}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;margin-bottom:2px;}
.card-sub{font-size:11px;color:var(--muted);margin-bottom:16px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.bar-label{font-size:11px;font-weight:600;color:var(--ink-2);width:76px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;height:20px;background:var(--border);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.bar-count{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);width:28px;flex-shrink:0;}
.sbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.sbar-label{font-size:11px;font-weight:700;color:var(--ink-2);width:84px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sbar-track{flex:1;height:26px;display:flex;border-radius:4px;overflow:hidden;gap:1px;background:var(--border);}
.sbar-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:default;min-width:0;flex-shrink:0;}
.sbar-seg:hover{opacity:.82;}
.sbar-n{font-size:11px;color:var(--muted);width:28px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;}
.no-lda{font-size:12px;color:var(--muted);padding:14px 0;text-align:center;}
.leg-row{display:flex;flex-wrap:wrap;gap:7px 14px;margin-top:14px;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);}
.leg-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.topic-legend-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 22px;}
.tl-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.tl-cell{display:flex;flex-direction:column;gap:5px;}
.tl-head{display:flex;align-items:center;gap:7px;}
.tl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.tl-name{font-size:12px;font-weight:700;color:var(--ink);}
.tl-kws{display:flex;flex-wrap:wrap;gap:3px;padding-left:17px;}
.kw-chip{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--border);color:var(--ink-2);font-weight:500;}
.tt{position:fixed;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 9px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:999;}
.note{font-size:11px;color:var(--muted);text-align:center;padding-top:2px;}
@media(max-width:680px){.kpi-row{grid-template-columns:repeat(2,1fr);}.charts-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="page">

  <div class="sel-bar">
    <span class="sel-title">사업보고서 변화 분석</span>
    <span class="sel-label">기업</span>

  <div class="kpi-row">

    <div class="kpi"><div class="kpi-label">변화율</div><div class="kpi-value" id="kv-pct" style="color:var(--blue)">-</div><div class="kpi-delta">UNCERTAIN 제외</div></div>
    <div class="kpi"><div class="kpi-label">주요 변화 유형</div><div class="kpi-value" id="kv-top" style="font-size:17px;color:var(--ink)">-</div><div class="kpi-delta" id="kd-top">-</div></div>
  </div>

  <div class="charts-row">
    <div class="card">
      <div class="card-title">① TF-IDF — 변화 유형 분포</div>
      <div class="card-sub" id="bar-sub">-</div>
      <div id="bar-chart"></div>
    </div>
    <div class="card">
      <div class="card-title">② LDA — 토픽별 변화 유형</div>
      <div class="card-sub">각 토픽이 주로 추가됐나 삭제됐나</div>
      <div id="tbar-chart"></div>
      <div class="leg-row" id="tbar-legend"></div>
    </div>
  </div>

  <div class="topic-legend-card" id="topic-legend-card">
    <div class="tl-title">LDA 토픽 설명</div>
    <div class="tl-grid" id="tl-grid"></div>
  </div>

  <div class="card" id="sbar-card">
    <div class="card-title">③ LDA — 변화 유형별 토픽 구성</div>
    <div class="card-sub">각 변화 유형이 어떤 토픽에 속하나</div>
    <div id="sbar-chart"></div>
    <div class="leg-row" id="sbar-legend"></div>
  </div>

  <div class="note">TF-IDF (Number Masked, th=0.3) → LDA (KiwiPy) · 금융감독원 사업보고서 2021–2025</div>
</div>

    leg.appendChild(li);
  });
}

function renderAll(){
  var d=getData();if(!d)return;
  renderKpi(d);renderBars(d);renderTopicByCt(d);renderTopicLegend(d);renderCtByTopic(d);
}

renderAll();

document.getElementById('sel-company').addEventListener('change',function(e){selCo=e.target.value;renderAll();});
document.getElementById('period-pills').addEventListener('click',function(e){
  var btn=e.target.closest('.pill');if(!btn)return;
  selP=btn.dataset.p;
  document.querySelectorAll('.pill').forEach(function(b){b.classList.toggle('active',b===btn);});
  renderAll();
});
var obs=new MutationObserver(renderAll);
obs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',renderAll);
</script>
