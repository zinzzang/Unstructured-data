<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사업보고서 변화 분석 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f7f9fc;--surface:#fff;--border:#dde5ee;--ink:#243447;--ink-2:#4f6275;--muted:#68788a;--blue:#4f7eaa;--orange:#a8753e;--aqua:#418775;--yellow:#b18d3e;--gray:#8b97a2;--red:#a95b57;--accent:#3a668f;color-scheme:light;}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d2a38;--surface:#263747;--border:#40576d;--ink:#f1f5f8;--ink-2:#ced9e2;--muted:#a7b6c4;--blue:#78a5ce;--orange:#cf9a60;--aqua:#72b39a;--yellow:#d0b15d;--gray:#adbac4;--red:#d2847d;--accent:#4b7eae;color-scheme:dark;}}
:root[data-theme=dark]{--bg:#1d2a38;--surface:#263747;--border:#40576d;--ink:#f1f5f8;--ink-2:#ced9e2;--muted:#a7b6c4;--blue:#78a5ce;--orange:#cf9a60;--aqua:#72b39a;--yellow:#d0b15d;--gray:#adbac4;--red:#d2847d;--accent:#4b7eae;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:28px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;}
.page{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.sel-bar{background:var(--accent);border-radius:10px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
.sel-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#fff;}
.sel-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.5px;align-self:center;}
.sel-company{background:rgba(255,255,255,.18);border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:600;padding:7px 11px;cursor:pointer;outline:none;font-family:inherit;-webkit-appearance:none;appearance:none;}
.sel-company option{background:#294b6d;color:#fff;}
.period-pills{display:flex;gap:5px;flex-wrap:wrap;}
.pill{padding:5px 13px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,.18);color:#fff;font-family:inherit;transition:background .15s;}
.pill.active,.pill:hover{background:rgba(255,255,255,.38);}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{position:relative;min-height:112px;overflow:hidden;border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 8px rgba(36,52,71,.035);}
.kpi::after{content:'';position:absolute;width:62px;height:62px;border-radius:50%;right:-22px;bottom:-27px;background:currentColor;opacity:.075;}
.kpi:nth-child(1){background:linear-gradient(135deg,#4a7fb4,#3a668f);border-color:#3a668f;color:#fff;box-shadow:0 8px 20px rgba(58,102,143,.2);}
.kpi:nth-child(2){background:color-mix(in srgb,var(--blue) 8%,var(--surface));border-color:color-mix(in srgb,var(--blue) 20%,var(--border));color:var(--blue);}
.kpi:nth-child(3){background:color-mix(in srgb,var(--aqua) 9%,var(--surface));border-color:color-mix(in srgb,var(--aqua) 21%,var(--border));color:var(--aqua);}
.kpi:nth-child(4){background:color-mix(in srgb,var(--orange) 10%,var(--surface));border-color:color-mix(in srgb,var(--orange) 23%,var(--border));color:var(--orange);}
.kpi-label{position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.01em;}
.kpi:nth-child(1) .kpi-label{color:rgba(255,255,255,.78);}
.kpi-value{position:relative;z-index:1;font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.055em;}
.kpi-value--type{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 7px;font-size:clamp(20px,2.25vw,28px);letter-spacing:-.04em;}
.kpi-value--type .kpi-count{font:inherit;color:currentColor;opacity:.72;}
.overview-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:14px;}
.card,.topic-legend-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;}
.card-title,.tl-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.02em;}
.card-sub{font-size:12px;color:var(--muted);margin-top:5px;margin-bottom:18px;}
.vchart{height:246px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:end;padding-top:18px;border-bottom:1px solid var(--border);}
.vbar-item{height:100%;min-width:0;display:grid;grid-template-rows:22px 1fr 43px;align-items:end;gap:6px;}
.vbar-value{font-size:12px;font-weight:700;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;}
.vbar-track{height:100%;display:flex;align-items:end;background:color-mix(in srgb,var(--border) 54%,transparent);border-radius:5px 5px 0 0;overflow:hidden;}
.vbar-fill{width:100%;min-height:3px;border-radius:5px 5px 0 0;transition:height .2s;}
.vbar-label{text-align:center;font-size:11px;font-weight:700;color:var(--ink-2);line-height:1.25;word-break:keep-all;}
.vbar-label span{display:block;margin-top:2px;font-weight:500;color:var(--muted);font-size:10px;}
.insight-card{display:flex;flex-direction:column;}
.insight-primary{margin-top:4px;padding:15px 0 17px;border-bottom:1px solid var(--border);}
.insight-eyebrow{font-size:11px;font-weight:700;color:var(--muted);}
.insight-value{font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;letter-spacing:-.04em;margin-top:4px;}
.insight-value span{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0;}
.direction{padding:15px 0;border-bottom:1px solid var(--border);display:grid;gap:9px;}
.direction-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-2);}
.direction-track{height:7px;border-radius:99px;overflow:hidden;background:var(--border);display:flex;}
.direction-add{background:var(--aqua);}.direction-sub{background:var(--red);}
.topic-summary{padding-top:15px;display:grid;gap:9px;}
.topic-summary-title{font-size:11px;font-weight:700;color:var(--muted);}
.topic-summary-row{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;font-size:12px;min-width:0;}
.topic-summary-dot{width:8px;height:8px;border-radius:50%;}.topic-summary-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.topic-summary-n{font-variant-numeric:tabular-nums;color:var(--muted);}
.sbar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.sbar-label{font-size:12px;font-weight:700;color:var(--ink-2);width:126px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sbar-track{flex:1;height:28px;display:flex;border-radius:5px;overflow:hidden;gap:1px;background:var(--border);}
.sbar-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;cursor:default;min-width:0;flex-shrink:0;}
.sbar-seg:hover{opacity:.84;}.sbar-n{font-size:12px;color:var(--muted);width:38px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;}
.no-lda{font-size:13px;color:var(--muted);padding:20px 0;text-align:center;}.leg-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;}.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);}.leg-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.tl-title{margin-bottom:14px;}.tl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;}.tl-cell{display:flex;flex-direction:column;gap:7px;}.tl-head{display:flex;align-items:center;gap:8px;}.tl-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}.tl-name{font-size:13px;font-weight:700;color:var(--ink);}.tl-kws{display:flex;flex-wrap:wrap;gap:4px;padding-left:19px;}.kw-chip{font-size:11px;padding:3px 7px;border-radius:99px;background:color-mix(in srgb,var(--border) 58%,transparent);color:var(--ink-2);font-weight:500;}
.topic-focus{background:color-mix(in srgb,#6d6895 4%,var(--surface));}
.tt{position:fixed;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 9px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:999;}
.note{font-size:11px;color:var(--muted);text-align:center;padding-top:2px;}
@media(max-width:680px){.kpi-row{grid-template-columns:repeat(2,1fr);}.overview-grid{grid-template-columns:1fr;}.card,.topic-legend-card{padding:18px;}.vchart{gap:7px;height:220px;}.vbar-label{font-size:10px;}.sbar-row{gap:8px;}.sbar-label{width:82px;font-size:11px;}.sbar-n{width:30px;font-size:11px;}.sbar-seg{font-size:9px;}}
</style>
</head>

</div>

const tt = document.getElementById('tt');
function showTt(e,t){tt.textContent=t;tt.style.opacity=1;tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-32)+'px';}
function hideTt(){tt.style.opacity=0;}

function isDark(){
  if(document.documentElement.dataset.theme==='dark') return true;
  if(document.documentElement.dataset.theme==='light') return false;
  return window.matchMedia('(prefers-color-scheme:dark)').matches;
}
function C(){
  return isDark()
    ?{changes:{NEW:'#78a5ce',EXPANDED:'#72b39a',MODIFIED:'#cf9a60',REDUCED:'#d0b15d',REMOVED:'#d2847d',UNCERTAIN:'#adbac4'},topics:['#6d9fc3','#8c9bc7','#a192c3','#b78ba9','#bc978c'],muted:'#a7b6c4',border:'#40576d',ink:'#f1f5f8',ink2:'#ced9e2'}

}
function topicColors(){return C().topics;}
function ctColor(ct){const c=C();return c.changes[ct]||c.changes.UNCERTAIN;}

const CT_ORDER=['NEW','EXPANDED','MODIFIED','REDUCED','REMOVED','UNCERTAIN'];
const CT_CHANGED=['NEW','EXPANDED','REMOVED','MODIFIED','REDUCED'];
const CT_DESC={UNCERTAIN:'판정 불확실',NEW:'새로 추가',EXPANDED:'내용 증가',REMOVED:'삭제',MODIFIED:'수정',REDUCED:'내용 감소'};
const CT_LABEL={NEW:'신규',EXPANDED:'확장',MODIFIED:'수정',REDUCED:'축소',REMOVED:'삭제',UNCERTAIN:'판정 보류'};

function topicLabel(kws){
  const c=kws.filter(cleanKw).slice(0,2);
  return c.length?c.join('/'):kws.slice(0,2).join('/');
}
function getKey(){return selCo+'|'+selP;}

function renderKpi(d){
  document.getElementById('kv-total').textContent=d.total.toLocaleString();
  document.getElementById('kv-changed').textContent=d.changed.toLocaleString();
  document.getElementById('kv-pct').textContent=d.pct+'%';
  const top=CT_CHANGED.reduce((a,c)=>((d.bar[c]||0)>(d.bar[a]||0)?c:a));
  document.getElementById('kv-top').textContent=top;
  document.getElementById('kd-top').textContent='('+d.bar[top]+'건)';
}

function renderBars(d){
  const el=document.getElementById('bar-chart');el.innerHTML='';
  const classified=CT_ORDER.reduce((sum,ct)=>sum+(d.bar[ct]||0),0);
  document.getElementById('bar-sub').textContent='분류된 변화 '+classified.toLocaleString()+'건';
  const max=Math.max(...CT_ORDER.map(ct=>d.bar[ct]||0));
  CT_ORDER.forEach(function(ct){
    const cnt=d.bar[ct]||0;
    const pct=classified?Math.round(cnt/classified*100):0;
    const item=document.createElement('div');item.className='vbar-item';
    item.innerHTML='<div class="vbar-value">'+cnt.toLocaleString()+'</div><div class="vbar-track"><div class="vbar-fill" style="height:'+(max?cnt/max*100:0).toFixed(1)+'%;background:'+ctColor(ct)+';"></div></div><div class="vbar-label">'+ct+'<span>'+CT_LABEL[ct]+' · '+pct+'%</span></div>';
    item.addEventListener('mousemove',function(e){showTt(e,ct+': '+cnt+'건 · '+CT_DESC[ct]);});
    item.addEventListener('mouseleave',hideTt);el.appendChild(item);
  });
}

function renderInsights(d){
  const top=CT_CHANGED.reduce((a,c)=>((d.bar[c]||0)>(d.bar[a]||0)?c:a));
  document.getElementById('insight-type').innerHTML=top+' <span>('+((d.bar[top]||0).toLocaleString())+'건)</span>';
  const added=(d.bar.NEW||0)+(d.bar.EXPANDED||0);
  const reduced=(d.bar.REMOVED||0)+(d.bar.REDUCED||0);
  const directional=added+reduced;
  document.getElementById('insight-direction').textContent=added.toLocaleString()+'건 : '+reduced.toLocaleString()+'건';
  document.getElementById('insight-add').style.width=(directional?added/directional*100:0)+'%';
  document.getElementById('insight-sub').style.width=(directional?reduced/directional*100:0)+'%';
  const list=document.getElementById('insight-topics');list.innerHTML='';
  if(!d.lda_ok||!d.topics.length){list.innerHTML='<div class="no-lda">LDA 미적용</div>';return;}
  const tc=topicColors();
  const ranked=d.topics.map(function(kws,ti){
    const total=CT_CHANGED.reduce(function(sum,ct){return sum+((d.sbar[ct]&&d.sbar[ct][ti])||0);},0);
    return {ti:ti,name:topicLabel(kws),total:total};
  }).sort(function(a,b){return b.total-a.total;}).slice(0,3);
  ranked.forEach(function(item){
    const row=document.createElement('div');row.className='topic-summary-row';
    row.innerHTML='<span class="topic-summary-dot" style="background:'+tc[item.ti]+'"></span><span class="topic-summary-name">T'+(item.ti+1)+'. '+item.name+'</span><span class="topic-summary-n">'+item.total.toLocaleString()+'건</span>';
    list.appendChild(row);
  });
}

function renderTopicByCt(d){
  const el=document.getElementById('tbar-chart');el.innerHTML='';
  const leg=document.getElementById('tbar-legend');leg.innerHTML='';
  const card=document.getElementById('tbar-card');
  if(!d.lda_ok||!d.topics.length){card.style.display='none';return;}
  card.style.display='';
  d.topics.forEach(function(kws,ti){
    var total=0;var ctCounts={};
    CT_CHANGED.forEach(function(ct){var v=(d.sbar[ct]&&d.sbar[ct][ti])||0;ctCounts[ct]=v;total+=v;});
    if(!total)return;
    var name=topicLabel(kws);
    var row=document.createElement('div');row.className='sbar-row';
    var lbl=document.createElement('div');lbl.className='sbar-label';lbl.textContent='T'+(ti+1)+': '+name;
    var track=document.createElement('div');track.className='sbar-track';
    CT_CHANGED.forEach(function(ct){
      var cnt=ctCounts[ct];if(!cnt)return;
      var pct=(cnt/total*100).toFixed(1);
      var seg=document.createElement('div');seg.className='sbar-seg';
      seg.style.width=pct+'%';seg.style.background=ctColor(ct);
      if(parseFloat(pct)>13)seg.textContent=Math.round(pct)+'%';
      seg.addEventListener('mousemove',function(e){showTt(e,'T'+(ti+1)+'('+name+') → '+ct+': '+cnt+'개 ('+Math.round(pct)+'%)');});
      seg.addEventListener('mouseleave',hideTt);
      track.appendChild(seg);
    });
    var n=document.createElement('div');n.className='sbar-n';n.textContent=total;
    row.appendChild(lbl);row.appendChild(track);row.appendChild(n);
    el.appendChild(row);
  });
  CT_CHANGED.forEach(function(ct){
    var li=document.createElement('div');li.className='leg-item';
    li.innerHTML='<div class="leg-swatch" style="background:'+ctColor(ct)+'"></div>'+ct;
    leg.appendChild(li);
  });
}

function renderTopicLegend(d){
  const tc=topicColors();
  const card=document.getElementById('topic-legend-card');

}

      seg.style.width=pct+'%';seg.style.background=tc[ti];
      if(parseFloat(pct)>13)seg.textContent=Math.round(pct)+'%';
      seg.addEventListener('mousemove',function(e){showTt(e,ct+' → T'+(ti+1)+'('+names[ti]+'): '+cnt+'개 ('+Math.round(pct)+'%)');});

document.getElementById('period-pills').addEventListener('click',function(e){
  var btn=e.target.closest('.pill');if(!btn)return;
  selP=btn.dataset.p;
  document.querySelectorAll('.pill').forEach(function(b){b.classList.toggle('active',b===btn);});
  renderAll();
});
var obs=new MutationObserver(renderAll);
obs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',renderAll);
</script>
